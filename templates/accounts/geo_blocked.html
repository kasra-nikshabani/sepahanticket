<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سپاهان تیکت</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: Tahoma, 'Segoe UI', sans-serif;
        background: linear-gradient(145deg, #1A1A2E 0%, #2a2a44 100%);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }
    .box {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(212, 175, 55, 0.25);
        border-radius: 24px;
        padding: 44px 32px;
        max-width: 440px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .icon-wrapper {
        width: 76px;
        height: 76px;
        background: rgba(212, 175, 55, 0.12);
        border: 2px solid rgba(212, 175, 55, 0.25);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 34px;
    }
    h1 {
        color: #D4AF37;
        font-size: 21px;
        margin: 0 0 14px;
        font-weight: 800;
    }
    p {
        color: rgba(255, 255, 255, 0.7);
        line-height: 1.9;
        font-size: 15px;
        margin: 0 0 10px;
    }
    p strong {
        color: #fff;
    }
    .btn {
        display: inline-block;
        margin-top: 18px;
        padding: 12px 28px;
        background: linear-gradient(145deg, #D4AF37, #b8960f);
        color: #1A1A2E;
        font-weight: 700;
        border-radius: 14px;
        text-decoration: none;
        font-size: 14px;
    }
</style>
</head>
<body>
    <div class="box">
        <div class="icon-wrapper">🌐</div>
        <h1>برای ورود، VPN خود را خاموش کنید</h1>
        <p>به نظر می‌رسه از طریق VPN یا فیلترشکن به سایت وصل شده اید. برای اینکه بتوانید از سایت استفاده کنی، لطفاً VPN خود را خاموش کن.</p>
        <a class="btn" href="/">تلاش مجدد</a>
    </div>
</body>
</html>
