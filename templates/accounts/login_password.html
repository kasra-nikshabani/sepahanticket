{% extends 'base.html' %}
{% load static %}
{% load currency_filters %}

{% block title %}ورود با رمز عبور{% endblock %}

{% block extra_css %}
<style>
    .login-password-page {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 20px;
        background: linear-gradient(135deg, #f5f0e8 0%, #e8e0d5 100%);
    }

    .login-password-card {
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.10), 0 6px 24px rgba(0, 0, 0, 0.06);
        overflow: hidden;
        width: 100%;
        max-width: 440px;
        transition: transform 0.3s ease;
        border: 1px solid rgba(212, 175, 55, 0.10);
    }

    .login-password-card:hover {
        transform: translateY(-4px);
    }

    .login-password-header {
        background: linear-gradient(135deg, #1A1A2E 0%, #2D2D44 100%);
        padding: 36px 32px 28px;
        text-align: center;
        position: relative;
        overflow: hidden;
    }

    .login-password-header::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -30%;
        width: 280px;
        height: 280px;
        background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
        border-radius: 50%;
    }

    .login-password-header::after {
        content: '';
        position: absolute;
        bottom: -40%;
        left: -20%;
        width: 200px;
        height: 200px;
        background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
        border-radius: 50%;
    }

    .login-password-header .icon-wrapper {
        position: relative;
        z-index: 2;
        width: 80px;
        height: 80px;
        background: rgba(212, 175, 55, 0.12);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 14px;
        border: 2px solid rgba(212, 175, 55, 0.20);
    }

    .login-password-header .icon-wrapper i {
        font-size: 36px;
        color: #D4AF37;
    }

    .login-password-header h2 {
        color: #ffffff;
        font-weight: 700;
        font-size: 24px;
        margin: 0 0 4px;
        position: relative;
        z-index: 2;
    }

    .login-password-header .subtitle {
        color: rgba(255, 255, 255, 0.55);
        font-size: 14px;
        position: relative;
        z-index: 2;
        margin: 0;
    }

    .login-password-body {
        padding: 32px 28px 28px;
    }

    .login-password-body .form-group {
        margin-bottom: 20px;
    }

    .login-password-body .form-group label {
        font-weight: 600;
        font-size: 14px;
        color: #1A1A2E;
        margin-bottom: 6px;
        display: block;
    }

    .login-password-body .form-group .input-group-text {
        background: #f8f6f2;
        border: 2px solid #e2e8f0;
        border-left: none;
        color: #8a8a9a;
        padding: 0 16px;
        border-radius: 12px 0 0 12px;
    }

    .login-password-body .form-group .form-control {
        border: 2px solid #e2e8f0;
        border-radius: 0 12px 12px 0;
        padding: 12px 16px;
        font-size: 15px;
        background: #fafbfc;
        transition: all 0.3s ease;
    }

    .login-password-body .form-group .form-control:focus {
        border-color: #D4AF37;
        box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.10);
        background: #ffffff;
        outline: none;
    }

    .login-password-body .form-group .form-control.is-invalid {
        border-color: #dc3545;
        box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.08);
    }

    .login-password-body .form-group .form-text {
        font-size: 13px;
        color: #8a8a9a;
        margin-top: 4px;
    }

    .btn-login-password {
        background: linear-gradient(135deg, #D4AF37, #B8960F);
        border: none;
        color: #1A1A2E;
        font-weight: 700;
        font-size: 16px;
        padding: 14px 20px;
        border-radius: 14px;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25);
        width: 100%;
    }

    .btn-login-password:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 35px rgba(212, 175, 55, 0.35);
        color: #1A1A2E;
        background: linear-gradient(135deg, #dbb93e, #c4a21a);
    }

    .btn-login-password:active {
        transform: translateY(0);
    }

    .login-password-footer {
        text-align: center;
        padding-top: 20px;
        border-top: 1px solid #f0ebe3;
        margin-top: 8px;
    }

    .login-password-footer a {
        color: #6c7a8a;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        transition: color 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .login-password-footer a:hover {
        color: #D4AF37;
    }

    .login-password-footer .back-icon {
        font-size: 14px;
    }

    .login-password-footer .back-text {
        color: #6c7a8a;
        font-size: 14px;
        margin-right: 6px;
    }

    .login-password-footer .divider {
        display: inline-block;
        width: 1px;
        height: 18px;
        background: #e2e8f0;
        margin: 0 14px;
        vertical-align: middle;
    }

    @media (max-width: 576px) {
        .login-password-header {
            padding: 28px 20px 22px;
        }
        .login-password-header .icon-wrapper {
            width: 64px;
            height: 64px;
        }
        .login-password-header .icon-wrapper i {
            font-size: 28px;
        }
        .login-password-header h2 {
            font-size: 20px;
        }
        .login-password-body {
            padding: 24px 18px 20px;
        }
        .login-password-footer .divider {
            display: none;
        }
        .login-password-footer {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="login-password-page">
    <div class="login-password-card">

        <!-- ===== هدر ===== -->
        <div class="login-password-header">
            <div class="icon-wrapper">
                <i class="fas fa-user-lock"></i>
            </div>
            <h2>ورود ویژه</h2>
            <p class="subtitle">مدیران و کاربران ویژه</p>
        </div>

        <!-- ===== بدنه ===== -->
        <div class="login-password-body">
            <form method="post">
                {% csrf_token %}

                <!-- نام کاربری -->
                <div class="form-group">
                    <label for="username"><i class="fas fa-user" style="margin-left: 6px; color: #D4AF37;"></i> نام کاربری</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-id-card"></i></span>
                        <input type="text" name="username" id="username" class="form-control" 
                               placeholder="نام کاربری خود را وارد کنید" required autofocus>
                    </div>
                </div>

                <!-- رمز عبور -->
                <div class="form-group">
                    <label for="password"><i class="fas fa-key" style="margin-left: 6px; color: #D4AF37;"></i> رمز عبور</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" id="password" class="form-control" 
                               placeholder="رمز عبور خود را وارد کنید" required>
                    </div>
                </div>

                <button type="submit" class="btn-login-password">
                    <i class="fas fa-arrow-left"></i> ورود
                </button>
            </form>

            <!-- ===== فوتر ===== -->
            <div class="login-password-footer">
                <a href="{% url 'accounts:phone_login' %}">
                    <i class="fas fa-phone-alt back-icon"></i>
                    <span class="back-text">ورود با شماره تلفن</span>
                </a>
                <span class="divider"></span>
                <a href="{% url 'accounts:phone_register' %}">
                    <i class="fas fa-user-plus back-icon"></i>
                    <span class="back-text">ثبت‌نام</span>
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
