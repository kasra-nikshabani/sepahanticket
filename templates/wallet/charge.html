{% extends 'base.html' %}
{% load static %}

{% block title %}شارژ کیف پول{% endblock %}

{% block content %}
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0"><i class="fas fa-plus-circle"></i> شارژ کیف پول</h4>
                    </div>
                    <div class="card-body">
                        <p class="text-muted">موجودی فعلی: <strong>{{ wallet.balance|floatformat:0 }} تومان</strong></p>
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="amount" class="form-label">مبلغ شارژ (تومان)</label>
                                <input type="number" name="amount" id="amount" class="form-control form-control-lg"
                                       placeholder="مثال: 50000" min="1000" max="10000000" required>
                                <small class="text-muted">حداقل ۱,۰۰۰ و حداکثر ۱۰,۰۰۰,۰۰۰ تومان</small>
                            </div>
                            <button type="submit" class="btn btn-success btn-lg w-100">
                                <i class="fas fa-check-circle"></i> شارژ کیف پول
                            </button>
                            <a href="{% url 'wallet:dashboard' %}" class="btn btn-secondary w-100 mt-2">
                                <i class="fas fa-arrow-right"></i> بازگشت
                            </a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
