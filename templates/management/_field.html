{% load persian_filters %}<div class="panel-field {% if field.field.widget.input_type == 'checkbox' %}is-checkbox{% endif %}">{% if field.field.widget.input_type == 'checkbox' %}<label for="{{ field.id_for_label }}">{{ field }}<span>{{ field.label }}</span></label>{% else %}<label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="panel-required">*</span>{% endif %}</label>{{ field }}{% endif %}{% if field.help_text %}<p>{{ field.help_text }}</p>{% endif %}{% for error in field.errors %}<p class="panel-field-error">{{ error|to_persian }}</p>{% endfor %}</div>
