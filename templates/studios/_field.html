{% if field.name == 'weekdays' %}
<fieldset class="edu-field studio-weekdays" data-edu-field="weekdays"><legend>{{ field.label }}{% if field.field.required %}<span aria-label="الزامی"> *</span>{% endif %}</legend>{{ field }}<p class="edu-help" id="{{ field.auto_id }}_help">{{ field.help_text }}</p><div class="edu-errors" id="{{ field.auto_id }}_errors" {% if field.errors %}role="alert"{% endif %}>{{ field.errors }}</div></fieldset>
{% else %}{% include 'education/_field.html' %}{% endif %}
