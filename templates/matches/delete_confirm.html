{% extends 'base.html' %}
{% load static %}

{% block title %}تأیید حذف{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h4><i class="fas fa-exclamation-triangle"></i> تأیید حذف</h4>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-trash" style="font-size: 4rem; color: #dc3545;"></i>
                    <h4 class="mt-3">آیا از حذف این {{ type }} مطمئن هستید؟</h4>
                    <p class="text-muted">{{ object.description }} - {{ object.amount|floatformat:0 }} ریال</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-check"></i> بله، حذف کن
                            </button>
                            <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> انصراف
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
