{% if field.is_hidden %}{{ field }}{% else %}<div class="edu-field{% if field.field.widget.input_type == 'checkbox' %} is-checkbox{% endif %}" data-edu-field="{{ field.name }}"><label for="{{ field.id_for_label }}">{% if field.field.widget.input_type == 'checkbox' %}{{ field }}{% endif %}{{ field.label }}{% if field.field.required %}<span aria-label="الزامی"> *</span>{% endif %}</label>{% if field.field.widget.input_type != 'checkbox' %}{{ field }}{% endif %}<p class="edu-help" id="{{ field.auto_id }}_help">{{ field.help_text }}</p><div class="edu-errors" id="{{ field.auto_id }}_errors" {% if field.errors %}role="alert"{% endif %}>{{ field.errors }}</div></div>{% endif %}
