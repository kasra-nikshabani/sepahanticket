<!-- ===== تایم‌لاین مراحل خرید بلیط ===== -->
<div class="purchase-timeline">
    <div class="pt-step {% if current_step > 1 %}pt-done{% elif current_step == 1 %}pt-active{% endif %}">
        <div class="pt-circle">{% if current_step > 1 %}<i class="fas fa-check"></i>{% else %}۱{% endif %}</div>
        <div class="pt-label">طبقه و تیم</div>
    </div>
    <div class="pt-line {% if current_step > 1 %}pt-done{% endif %}"></div>

    <div class="pt-step {% if current_step > 2 %}pt-done{% elif current_step == 2 %}pt-active{% endif %}">
        <div class="pt-circle">{% if current_step > 2 %}<i class="fas fa-check"></i>{% else %}۲{% endif %}</div>
        <div class="pt-label">انتخاب سکو</div>
    </div>
    <div class="pt-line {% if current_step > 2 %}pt-done{% endif %}"></div>

    <div class="pt-step {% if current_step > 3 %}pt-done{% elif current_step == 3 %}pt-active{% endif %}">
        <div class="pt-circle">{% if current_step > 3 %}<i class="fas fa-check"></i>{% else %}۳{% endif %}</div>
        <div class="pt-label">انتخاب صندلی</div>
    </div>
    <div class="pt-line {% if current_step > 3 %}pt-done{% endif %}"></div>

    <div class="pt-step {% if current_step > 4 %}pt-done{% elif current_step == 4 %}pt-active{% endif %}">
        <div class="pt-circle">{% if current_step > 4 %}<i class="fas fa-check"></i>{% else %}۴{% endif %}</div>
        <div class="pt-label">اطلاعات و پرداخت</div>
    </div>
</div>

<style>
    .purchase-timeline {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 0;
        max-width: 720px;
        margin: 0 auto 24px;
        padding: 16px 12px;
        background: #ffffff;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
    }

    .pt-step {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 0 0 auto;
        width: 84px;
    }

    .pt-circle {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        background: #f1f3f4;
        color: #6c757d;
        border: 2px solid #e8eaed;
        transition: all 0.3s ease;
        flex-shrink: 0;
    }

    .pt-label {
        margin-top: 6px;
        font-size: 11px;
        font-weight: 600;
        color: #6c757d;
        text-align: center;
        line-height: 1.3;
    }

    .pt-step.pt-active .pt-circle {
        background: linear-gradient(135deg, #D4AF37, #B8960F);
        border-color: #D4AF37;
        color: #1A1A2E;
        box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.2);
    }

    .pt-step.pt-active .pt-label {
        color: #1A1A2E;
        font-weight: 700;
    }

    .pt-step.pt-done .pt-circle {
        background: #1A1A2E;
        border-color: #1A1A2E;
        color: #D4AF37;
    }

    .pt-step.pt-done .pt-label {
        color: #1A1A2E;
    }

    .pt-line {
        flex: 1 1 auto;
        height: 2px;
        background: #e8eaed;
        margin-top: 15px;
        min-width: 12px;
    }

    .pt-line.pt-done {
        background: #1A1A2E;
    }

    @media (max-width: 576px) {
        .purchase-timeline {
            padding: 12px 6px;
        }
        .pt-step {
            width: 58px;
        }
        .pt-circle {
            width: 26px;
            height: 26px;
            font-size: 12px;
        }
        .pt-label {
            font-size: 9px;
            margin-top: 4px;
        }
        .pt-line {
            margin-top: 12px;
        }
    }
</style>
